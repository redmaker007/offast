[plugin]

name="Save State"
description="Group-based save/load. Nodes join the \"persist\" group, declare a save_id and implement save_data()/load_data(); SaveState walks them and writes to user://. Ships a generic packer that serialises plain-data RefCounted objects by reflection, so your data classes need no save code at all. Drop this folder into addons/ of any Godot 4 project and enable it."
author="redmaker"
version="1.0"
script="save_state.gd"
