[plugin]

name="UI Polish"
description="Reusable button hover/press feedback (HoverScale), a pop-in/pop-out window base class (popup_window) with a sequencing autoload (WindowManager), and a scene fade transition autoload (SceneTransition). Drop this folder into addons/ of any Godot 4 project and enable it."
