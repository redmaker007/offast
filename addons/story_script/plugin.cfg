[plugin]

name="Story Script"
description="Imports .story text files into day_plan / world_book resources. Write the game's story as plain text (one file per day) instead of clicking through the Inspector; Godot re-imports on save, so there is no generate step to forget. Parsing itself lives in main_game/game/story/story_parser.gd and does not need the editor."
author="redmaker"
version="1.0"
script="plugin.gd"
